name: poll

on:
  # Primary trigger: Voyager's Cloudflare cron (every 30 min) via the GitHub API.
  workflow_dispatch:
    inputs:
      tiers:
        description: "Comma-separated tiers to poll (hot,warm,cold)"
        required: false
        default: "hot"
  # Backup only: GitHub's own schedule is best-effort and can lag.
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - name: Restore poll state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: poll-state-${{ github.run_id }}
          restore-keys: poll-state-

      - name: Poll
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_HMAC_KEY: ${{ secrets.INGEST_HMAC_KEY }}
          TIERS: ${{ github.event.inputs.tiers || 'hot' }}
        run: node src/run.ts

      - name: Save poll state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: poll-state-${{ github.run_id }}
